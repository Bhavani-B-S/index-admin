const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
let FB;
if(!DEMO){const [a,f,g]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-storage.js')]);FB={...a,...f,...g}}
else{
 const store=new Map(),ts=()=>({seconds:Date.now()/1000,toDate:()=>new Date()}),rid=()=>Math.random().toString(36).slice(2,12);

 for(const [p,d] of Object.entries(SEED.single))put(p,d);
 for(const [c,arr] of Object.entries(SEED.lists))arr.forEach((d,n)=>put(c+'/'+rid(),{...d,active:true,order:n,createdAt:ts(),updatedAt:ts()}));
 [['Rahul Sharma','rahul@example.com','9876543210','Sharma Traders','ERP Solutions','We need an ERP for inventory and billing across 3 stores.',0,2],['Anita Rao','anita@example.com','9123456780','Rao Clinics','Website Development','Looking for a website with appointment booking.',0,26],['Kiran Patel','kiran@example.com','9988776655','','Digital Marketing','Interested in SEO and Google Ads packages.',1,70]].forEach(([name,email,phone,company,service,message,read,h])=>put('enquiries/'+rid(),{name,email,phone,company,service,message,read:!!read,createdAt:{seconds:Date.now()/1000-h*3600,toDate:()=>new Date(Date.now()-h*3600e3)}}));
 FB={initializeApp:()=>({}),getFirestore:()=>({}),getStorage:()=>({}),
  collection:(_,c)=>({col:c}),
  doc:(_,...a)=>({path:a.join('/')}),
  serverTimestamp:ts,
  getDoc:async r=>({exists:()=>store.has(r.path),data:()=>store.has(r.path)?{...store.get(r.path)}:undefined,id:r.path.split('/').pop()}),
  getDocs:async c=>{const l=kids(c.col).map(([k,v])=>({id:k.split('/').pop(),data:()=>({...v})}));return{docs:l,size:l.length,empty:!l.length}},
  setDoc:async(r,d,o)=>{put(r.path,d,o&&o.merge)},
  addDoc:async(c,d)=>{const id=rid();put(c.col+'/'+id,d);return{id}},
  updateDoc:async(r,d)=>{put(r.path,d,true)},
  deleteDoc:async r=>{store.delete(r.path)},
  ref:(_,p)=>({path:p}),
  uploadBytes:async(r,f)=>{store.set('__blob/'+r.path,URL.createObjectURL(f))},

  deleteObject:async()=>{}};
}
const {initializeApp,getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp,getStorage,ref,uploadBytes,getDownloadURL,deleteObject}=FB;

/* ---- schema: single documents ---- */
const SINGLE={
 general:['Website Settings','settings/general',[F('company','Company name'),F('logo','Logo','image'),F('favicon','Favicon','image'),F('phone','Phone'),F('email','Email'),F('address','Address','area'),F('website','Website URL'),F('whatsapp','WhatsApp number'),F('instagram','Instagram URL'),F('facebook','Facebook URL'),F('linkedin','LinkedIn URL'),F('youtube','YouTube URL')]],

 contact:['Contact','contact/settings',[F('heading','Section heading (e.g. Get in touch)'),F('text','Section text','area'),F('founderLabel','Person label (e.g. Founder)'),F('founderName','Person name'),F('hours','Business hours'),F('mapLabel','Map placeholder text'),F('mapUrl','Google Maps EMBED URL (blank = placeholder)'),F('formTitle','Form heading (optional)'),F('serviceLabel','“Service required” label'),F('serviceOptions','Service dropdown options (one per line, blank = use Services list)','lines'),F('messagePlaceholder','Message box placeholder'),F('submitText','Submit button text'),F('responseNote','Note under the button')]],
 ylteam:['YL Developers Strip','settings/ylteam',[F('visible','Strip visible','bool'),F('badge','Badge text'),F('title','Title'),F('subtitle','Subtitle / tagline'),F('url','Title link URL (optional)')]],

};

/* ---- form helpers ---- */
const formHtml=(fs,d={})=>fs.map(f=>{const v=d[f.k];
 if(f.t==='bool')return`<label class="chk"><input type="checkbox" data-k="${f.k}" ${v!==false&&v!==undefined||(v===undefined&&f.k!=='maintenance')?'checked':''}>${f.l}</label>`;

function wireUploads(root){
 root.querySelectorAll('[data-up]').forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;i.disabled=true;
  try{const r=await uploadImg(f);$(`[data-k="${i.dataset.up}"]`,root).value=r;i.closest('.img').querySelector('img').src=r;toast('Image uploaded')}catch(e){toast('Upload failed: '+e.message,1)}i.disabled=false});

async function uploadImg(file){const path=`uploads/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`,r=ref(st,path);
 await uploadBytes(r,file);const url=await getDownloadURL(r);await addDoc(collection(db,'media'),{name:file.name,url,path,createdAt:serverTimestamp()});return url}

 const load=async()=>{const s=await getDocs(collection(db,col));return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0))};

 const edit=(it)=>{const m=modal(`<h3>${it?'Edit':'Add'} ${title.replace(/s$/,'')}</h3><br>${formHtml(fs,it||{})}<div class="acts"><button class="btn" id="ok">Save</button><button class="btn ghost" id="no">Cancel</button></div>`);
  wireUploads(m);$('#no').onclick=closeM;$('#ok').onclick=async()=>{const d=collect(fs,m);if(!d.title&&!d.name)return toast('Title is required',1);
   try{if(it)await touch(`${col}/${it.id}`,d);else await addDoc(collection(db,col),{...d,[ak]:ak==='approved'?true:true,order:items.length,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   closeM();toast('Saved');items=await load();draw()}catch(e){toast(e.message,1)}}};
 const act=async(a,it)=>{try{
  if(a==='ed')return edit(it);
  if(a==='del'){if(!confirmBox('Delete this item permanently?'))return;await deleteDoc(doc(db,col,it.id))}
  if(a==='tg')await updateDoc(doc(db,col,it.id),{[ak]:it[ak]===false,updatedAt:serverTimestamp()});
  if(a==='dup'){const {id,...r}=it;await addDoc(collection(db,col),{...r,title:(r.title||'')+(r.title?' (copy)':''),order:items.length,createdAt:serverTimestamp()})}
  if(a==='up'||a==='dn'){const i=items.indexOf(it),j=a==='up'?i-1:i+1;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];await Promise.all(items.map((x,n)=>updateDoc(doc(db,col,x.id),{order:n})))}
  items=await load();draw();toast('Done')}catch(e){toast(e.message,1)}};
 draw()}

async function viewEnq(){const load=async()=>(await getDocs(collection(db,'enquiries'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 let items=await load();
 const draw=()=>{const q=($('#q')?.value||'').toLowerCase(),f=$('#f')?.value||'all',s=$('#s')?.value||'new';
  let l=items.filter(i=>JSON.stringify([i.name,i.email,i.phone,i.message,i.company]).toLowerCase().includes(q)&&(f==='all'||(f==='unread')===!i.read));if(s==='old')l=[...l].reverse();
  $('#area').innerHTML=`<div class="tools"><input id="q" placeholder="Search enquiries…" value="${esc(q)}"><select id="f"><option value="all">All</option><option value="unread" ${f==='unread'?'selected':''}>Unread</option><option value="read" ${f==='read'?'selected':''}>Read</option></select><select id="s"><option value="new">Newest first</option><option value="old" ${s==='old'?'selected':''}>Oldest first</option></select></div><div class="card"><table><tr><th>Name</th><th>Contact</th><th>Date</th><th>Status</th></tr>`+
  (l.map(i=>`<tr class="${i.read?'':'un'}" data-i="${i.id}" style="cursor:pointer"><td>${esc(i.name)}<div class="muted">${esc(i.company||'')}</div></td><td>${esc(i.email)}<div class="muted">${esc(i.phone)}</div></td><td>${fmt(i.createdAt)}</td><td><span class="chip ${i.read?'off':''}">${i.read?'Read':'Unread'}</span></td></tr>`).join('')||`<tr><td colspan=4 class="empty">No enquiries</td></tr>`)+`</table></div>`;
  ['q','f','s'].forEach(x=>$('#'+x).oninput=draw);
  $('#area').querySelectorAll('tr[data-i]').forEach(r=>r.onclick=()=>open(items.find(x=>x.id===r.dataset.i)))};
 const open=async i=>{const m=modal(`<h3>${esc(i.name)}</h3><p class="muted">${esc(i.email)} · ${esc(i.phone)} · ${esc(i.company||'')}<br>${fmt(i.createdAt)} · ${esc(i.service||'')}</p><br><p style="white-space:pre-wrap">${esc(i.message)}</p><br><div class="acts"><button class="btn" id="rd">Mark as ${i.read?'unread':'read'}</button><button class="btn red" id="dl">Delete</button><button class="btn ghost" id="no">Close</button></div>`);
  $('#no').onclick=closeM;if(!i.read){await updateDoc(doc(db,'enquiries',i.id),{read:true});i.read=true;badge()}
  $('#rd').onclick=async()=>{await updateDoc(doc(db,'enquiries',i.id),{read:!i.read});closeM();items=await load();draw();badge()};
  $('#dl').onclick=async()=>{if(!confirmBox('Delete this enquiry?'))return;await deleteDoc(doc(db,'enquiries',i.id));closeM();items=await load();draw();badge()}};
 draw()}

async function viewMedia(){const load=async()=>(await getDocs(collection(db,'media'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));let items=await load();
 const draw=()=>{const q=($('#q')?.value||'').toLowerCase();$('#area').innerHTML=`<div class="tools"><input id="q" placeholder="Search images…" value="${esc(q)}"><div class="sp"></div><label class="btn" style="margin:0">+ Upload<input id="up" type="file" accept="image/*" multiple hidden></label></div><div class="mg">`+
 (items.filter(i=>i.name.toLowerCase().includes(q)).map(i=>`<div class="card"><img src="${esc(i.url)}" loading="lazy"><div class="muted" style="margin:6px 0;word-break:break-all">${esc(i.name)}<br>${fmt(i.createdAt)}</div><div class="acts"><button class="btn ghost sm" data-c="${i.id}">Copy URL</button><button class="btn red sm" data-d="${i.id}">Delete</button></div></div>`).join('')||'<div class="empty">No images</div>')+`</div>`;
 $('#q').oninput=draw;$('#up').onchange=async e=>{for(const f of e.target.files)try{await uploadImg(f)}catch(x){toast(x.message,1)}items=await load();draw();toast('Uploaded')};
 $('#area').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(items.find(x=>x.id===b.dataset.c).url);toast('URL copied')});
 $('#area').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const i=items.find(x=>x.id===b.dataset.d);if(!confirmBox('Delete image?'))return;try{await deleteObject(ref(st,i.path))}catch(e){}await deleteDoc(doc(db,'media',i.id));items=await load();draw()})};draw()}

async function viewDash(){const cnt=async c=>(await getDocs(collection(db,c))).size;
 const [sv,pr,tm,rt,en]=await Promise.all(['services','projects','team','ratings','enquiries'].map(cnt));
 const th=(await getDoc(doc(db,'settings','theme'))).data()||{};
 const enq=(await getDocs(collection(db,'enquiries'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,5);
 $('#area').innerHTML=`<div class="grid">${[['Total Projects',pr],['Total Services',sv],['Team Members',tm],['Testimonials',rt],['Enquiries',en],['Website Status',th.maintenance?'Maintenance':'Live']].map(([l,v])=>`<div class="card stat"><span class="muted">${l}</span><b>${v}</b></div>`).join('')}</div>
 <div class="card"><h3>Quick actions</h3><br><div class="acts"><a class="btn" href="#projects">Add project</a><a class="btn ghost" href="#services">Edit services</a><a class="btn ghost" href="#enquiries">View enquiries</a><a class="btn ghost" href="#media">Upload media</a><button class="btn ghost" id="seed">Import current website content</button></div><p class="muted" style="margin-top:10px">“Import” copies the existing hard-coded NEXORA content into the database (only fills collections that are empty).</p></div>
 <div class="card"><h3>Recent enquiries</h3><br>${enq.map(i=>`<p>${i.read?'':'● '}<b>${esc(i.name)}</b> — ${esc((i.message||'').slice(0,80))} <span class="muted">${fmt(i.createdAt)}</span></p>`).join('')||'<p class="muted">None yet</p>'}</div>`;
 $('#seed').onclick=async()=>{if(!confirmBox('Import default NEXORA content into empty collections?'))return;$('#seed').disabled=true;
  try{for(const [p,d] of Object.entries(SEED.single))if(!(await getDoc(doc(db,...p.split('/')))).exists())await touch(p,d);
   for(const [c,arr] of Object.entries(SEED.lists))if((await getDocs(collection(db,c))).empty)for(const [n,d] of arr.entries())await addDoc(collection(db,c),{...d,active:true,order:n,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   toast('Imported');viewDash()}catch(e){toast(e.message,1)}}}

async function badge(){try{const s=await getDocs(collection(db,'enquiries'));const n=s.docs.filter(d=>!d.data().read).length;$('#badge').textContent=n||''}catch(e){}}
const route=async()=>{const k=location.hash.slice(1)||'dashboard';const lbl=MENU.find(m=>m[0]===k)?.[1]||'Dashboard';$('#title').textContent=lbl;
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));$('#side').classList.remove('open');$('#area').innerHTML='<div class="muted">Loading…</div>';
 try{if(SINGLE[k])await viewSingle(k);else if(LIST[k])await viewList(k);else if(k==='enquiries')await viewEnq();else if(k==='media')await viewMedia();else await viewDash()}catch(e){$('#area').innerHTML=`<div class="card err">${esc(e.message)}<br><span class="muted">Check your Firestore rules and that you are signed in as the admin.</span></div>`}};
const start=()=>{$('#view').href=SITE_URL;
 $('#nav').innerHTML=MENU.map(([k,l])=>`<a data-k="${k}" href="#${k}">${l}</a>`).join('');
 $('#burger').onclick=()=>$('#side').classList.toggle('open');$('#bell').onclick=()=>location.hash='enquiries';
 addEventListener('hashchange',route);route();badge()};
start();
if(DEMO){const bn=document.createElement('div');bn.style.cssText='position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#16213e;color:#e6c35c;border:1px solid #e6c35c55;padding:8px 14px;border-radius:999px;font:12px sans-serif;z-index:99';bn.textContent='Preview mode — sample data, changes are not saved';document.body.append(bn)}
</script></body></html>
