<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · NEXORA</title>
<style>
:root{--bg:#0a1330;--panel:#101b44;--line:#223062;--text:#e8ecf8;--muted:#9aa6cf;--gold:#d4a73a;--danger:#e5646b;--ok:#4fbf8b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--gold)}
button,input,textarea{font:inherit}
input,textarea{width:100%;padding:.65rem .8rem;background:#0b1538;border:1px solid var(--line);border-radius:8px;color:var(--text)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;margin:.9rem 0 .3rem;color:var(--muted);font-size:.9rem}
.btn{display:inline-block;padding:.6rem 1.1rem;border:0;border-radius:8px;background:var(--gold);color:#1a1405;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin-top:.8rem;font-size:.92rem}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2rem}
.card h1{margin:0 0 .25rem;font-size:1.5rem}
.card p.sub{margin:0 0 1rem;color:var(--muted)}
.row{display:flex;gap:.5rem}
.linkbtn{background:none;border:0;color:var(--gold);cursor:pointer;padding:0;text-decoration:underline}
/* dashboard */
header.top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line);background:var(--panel)}
header.top strong{font-size:1.1rem}
main{max-width:960px;margin:0 auto;padding:1.5rem}
nav.tabs{display:flex;gap:.5rem;margin-bottom:1.25rem}
nav.tabs button{background:none;border:1px solid var(--line);color:var(--muted);padding:.5rem 1rem;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
.item{display:flex;gap:1rem;justify-content:space-between;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.75rem}
.item h3{margin:0 0 .2rem;font-size:1.05rem}
.item p{margin:.1rem 0;color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.tag{font-size:.78rem;padding:.1rem .5rem;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.actions{display:flex;gap:.4rem;flex-wrap:wrap}
form.edit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.empty{color:var(--muted);padding:1.5rem;text-align:center;border:1px dashed var(--line);border-radius:10px}
@media(max-width:600px){.item{flex-direction:column}}
@media(prefers-reduced-motion:no-preference){.btn{transition:filter .15s}.btn:hover{filter:brightness(1.1)}}
</style>
</head>
<body>
<header class="top">
  <strong>NEXORA Admin</strong>
  <div><span id="who" class="tag"></span> <button class="btn ghost" id="logout">Sign out</button></div>
</header>

<main id="app" hidden>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="projects">Projects</button>
    <button role="tab" aria-selected="false" data-tab="reviews">Reviews</button>
  </nav>

  <section id="projects">
    <form class="edit" id="pform">
      <h2 id="ptitle" style="margin:0">Add project</h2>
      <input type="hidden" id="pid">
      <label for="name">Project name</label><input id="name" required>
      <label for="desc">Description</label><textarea id="desc" rows="3"></textarea>
      <label for="url">Live link</label><input id="url" type="url" placeholder="https://">
      <label for="img">Image link (optional)</label><input id="img" type="url" placeholder="https://">
      <label><input type="checkbox" id="visible" checked style="width:auto"> Show on website</label>
      <div class="actions" style="margin-top:1rem">
        <button class="btn" id="psave">Save project</button>
        <button type="button" class="btn ghost" id="pcancel" hidden>Cancel</button>
      </div>
      <div class="msg" id="pmsg" role="status" aria-live="polite"></div>
    </form>
    <div id="plist"></div>
  </section>

  <section id="reviews" hidden><div id="rlist"></div></section>
</main>

<div class="center" id="denied" hidden>
  <div class="card">
    <h1>No admin access</h1>
    <p class="sub">This account isn't on the admin list. Sign in with an admin account.</p>
    <button class="btn" id="deniedOut">Sign out</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Paste your Firebase web app config here (Firebase Console > Project settings > Your apps > Web)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, collection, getDocs, addDoc, setDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const out = async () => { await signOut(auth); location.replace("login.html"); };
$("logout").onclick = out; $("deniedOut").onclick = out;

// ---- Auth guard: signed in AND listed in admins/{uid} ----
onAuthStateChanged(auth, async user => {
  if (!user) return location.replace("login.html");
  $("who").textContent = user.email;
  let ok = false;
  try { ok = (await getDoc(doc(db, "admins", user.uid))).exists(); } catch {}
  if (!ok) { $("denied").hidden = false; return; }
  $("app").hidden = false;
  loadProjects(); loadReviews();
});

// ---- Tabs ----
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
  $("projects").hidden = b.dataset.tab !== "projects";
  $("reviews").hidden = b.dataset.tab !== "reviews";
});

// ---- Projects ----
let projects = [];
async function loadProjects() {
  const snap = await getDocs(query(collection(db, "projects"), orderBy("createdAt", "desc")));
  projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  $("plist").innerHTML = projects.length ? projects.map(p => `
    <div class="item"><div>
      <h3>${esc(p.name)} <span class="tag">${p.visible ? "Visible" : "Hidden"}</span></h3>
      <p>${esc(p.desc)}</p><p>${esc(p.url)}</p></div>
      <div class="actions">
        <button class="btn ghost" data-edit="${p.id}">Edit</button>
        <button class="btn danger" data-del="${p.id}">Delete</button>
      </div></div>`).join("")
    : `<div class="empty">No projects yet. Add your first project above.</div>`;
}
$("plist").onclick = async e => {
  const edit = e.target.dataset.edit, del = e.target.dataset.del;
  if (edit) {
    const p = projects.find(x => x.id === edit);
    $("pid").value = p.id; $("name").value = p.name || ""; $("desc").value = p.desc || "";
    $("url").value = p.url || ""; $("img").value = p.img || ""; $("visible").checked = !!p.visible;
    $("ptitle").textContent = "Edit project"; $("pcancel").hidden = false; scrollTo({top:0});
  }
  if (del && confirm("Delete this project? This can't be undone.")) {
    await deleteDoc(doc(db, "projects", del)); loadProjects();
  }
};
function resetForm() { $("pform").reset(); $("pid").value = ""; $("ptitle").textContent = "Add project"; $("pcancel").hidden = true; }
$("pcancel").onclick = resetForm;
$("pform").onsubmit = async e => {
  e.preventDefault();
  const data = { name: $("name").value.trim(), desc: $("desc").value.trim(), url: $("url").value.trim(),
                 img: $("img").value.trim(), visible: $("visible").checked };
  $("psave").disabled = true;
  try {
    if ($("pid").value) await updateDoc(doc(db, "projects", $("pid").value), { ...data, updatedAt: serverTimestamp() });
    else await addDoc(collection(db, "projects"), { ...data, createdAt: serverTimestamp() });
    $("pmsg").textContent = "Saved."; $("pmsg").className = "msg ok";
    resetForm(); loadProjects();
  } catch { $("pmsg").textContent = "Couldn't save. Check your connection and permissions."; $("pmsg").className = "msg err"; }
  $("psave").disabled = false;
};

// ---- Reviews (approve / hide / delete) ----
async function loadReviews() {
  const snap = await getDocs(query(collection(db, "reviews"), orderBy("createdAt", "desc")));
  const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  $("rlist").innerHTML = rows.length ? rows.map(r => `
    <div class="item"><div>
      <h3>${esc(r.name || "Anonymous")} <span class="tag">${"★".repeat(r.rating || 0)}</span>
        <span class="tag">${r.approved ? "Approved" : "Pending"}</span></h3>
      <p>${esc(r.text)}</p></div>
      <div class="actions">
        <button class="btn ghost" data-toggle="${r.id}" data-state="${r.approved ? 1 : 0}">${r.approved ? "Hide" : "Approve"}</button>
        <button class="btn danger" data-rdel="${r.id}">Delete</button>
      </div></div>`).join("")
    : `<div class="empty">No reviews yet.</div>`;
}
$("rlist").onclick = async e => {
  const t = e.target.dataset;
  if (t.toggle) { await updateDoc(doc(db, "reviews", t.toggle), { approved: t.state !== "1" }); loadReviews(); }
  if (t.rdel && confirm("Delete this review?")) { await deleteDoc(doc(db, "reviews", t.rdel)); loadReviews(); }
};
</script>
</body>
</html>
