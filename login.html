<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · NEXORA Admin</title>
<style>
:root{--bg:#0a1330;--panel:#101b44;--line:#223062;--text:#e8ecf8;--muted:#9aa6cf;--gold:#d4a73a;--danger:#e5646b;--ok:#4fbf8b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--gold)}
button,input,textarea{font:inherit}
input,textarea{width:100%;padding:.65rem .8rem;background:#0b1538;border:1px solid var(--line);border-radius:8px;color:var(--text)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;margin:.9rem 0 .3rem;color:var(--muted);font-size:.9rem}
.btn{display:inline-block;padding:.6rem 1.1rem;border:0;border-radius:8px;background:var(--gold);color:#1a1405;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin-top:.8rem;font-size:.92rem}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2rem}
.card h1{margin:0 0 .25rem;font-size:1.5rem}
.card p.sub{margin:0 0 1rem;color:var(--muted)}
.row{display:flex;gap:.5rem}
.linkbtn{background:none;border:0;color:var(--gold);cursor:pointer;padding:0;text-decoration:underline}
/* dashboard */
header.top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line);background:var(--panel)}
header.top strong{font-size:1.1rem}
main{max-width:960px;margin:0 auto;padding:1.5rem}
nav.tabs{display:flex;gap:.5rem;margin-bottom:1.25rem}
nav.tabs button{background:none;border:1px solid var(--line);color:var(--muted);padding:.5rem 1rem;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
.item{display:flex;gap:1rem;justify-content:space-between;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.75rem}
.item h3{margin:0 0 .2rem;font-size:1.05rem}
.item p{margin:.1rem 0;color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.tag{font-size:.78rem;padding:.1rem .5rem;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.actions{display:flex;gap:.4rem;flex-wrap:wrap}
form.edit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.empty{color:var(--muted);padding:1.5rem;text-align:center;border:1px dashed var(--line);border-radius:10px}
@media(max-width:600px){.item{flex-direction:column}}
@media(prefers-reduced-motion:no-preference){.btn{transition:filter .15s}.btn:hover{filter:brightness(1.1)}}
</style>
</head>
<body>
<div class="center">
  <div class="card">
    <h1>NEXORA Admin</h1>

    <section id="signin">
      <p class="sub">Sign in to manage your website.</p>
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <div class="row">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" class="btn ghost" id="toggle" aria-label="Show password">Show</button>
        </div>
        <p style="margin:.8rem 0 0"><button type="button" class="linkbtn" id="forgot">Forgot password?</button></p>
        <button class="btn" id="submit" style="width:100%;margin-top:1rem">Sign in</button>
      </form>
    </section>

    <section id="reset" hidden>
      <p class="sub">Enter your admin email and we'll send a reset link.</p>
      <form id="resetForm" novalidate>
        <label for="remail">Email</label>
        <input id="remail" type="email" required>
        <button class="btn" style="width:100%;margin-top:1rem">Send reset link</button>
      </form>
      <p style="margin:1rem 0 0"><button type="button" class="linkbtn" id="back">Back to sign in</button></p>
    </section>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <p style="margin:1rem 0 0;font-size:.85rem"><a href="index.html">Back to website</a></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Paste your Firebase web app config here (Firebase Console > Project settings > Your apps > Web)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
import { signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const $ = id => document.getElementById(id);
const msg = (t, c="") => { $("msg").textContent = t; $("msg").className = "msg " + c; };

// Already signed in → go straight to the dashboard
onAuthStateChanged(auth, u => { if (u) location.replace("admin.html"); });

$("toggle").onclick = () => {
  const show = $("password").type === "password";
  $("password").type = show ? "text" : "password";
  $("toggle").textContent = show ? "Hide" : "Show";
};
$("forgot").onclick = () => { $("signin").hidden = true; $("reset").hidden = false; msg(""); $("remail").value = $("email").value; };
$("back").onclick = () => { $("reset").hidden = true; $("signin").hidden = false; msg(""); };

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  if (!$("email").value || !$("password").value) return msg("Enter your email and password.", "err");
  $("submit").disabled = true; msg("Signing in…");
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    location.replace("admin.html");
  } catch (err) {
    const m = {
      "auth/invalid-credential": "Email or password is incorrect.",
      "auth/invalid-email": "That email address isn't valid.",
      "auth/user-disabled": "This account is disabled in Firebase.",
      "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
      "auth/network-request-failed": "Network error. Check your connection.",
      "auth/operation-not-allowed": "Email/Password sign-in is not enabled in Firebase (Authentication > Sign-in method).",
      "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "The apiKey in firebaseConfig is wrong. Paste your real Firebase config.",
      "auth/invalid-api-key": "The apiKey in firebaseConfig is wrong. Paste your real Firebase config.",
      "auth/configuration-not-found": "Firebase Authentication isn't set up for this project yet (click Get started in Authentication).",
      "auth/unauthorized-domain": "This domain isn't authorized. Add it in Authentication > Settings > Authorized domains."
    };
    console.error(err.code, err);
    msg((m[err.code] || "Sign-in failed.") + " (" + err.code + ")", "err");
    $("submit").disabled = false;
  }
};

$("resetForm").onsubmit = async e => {
  e.preventDefault();
  try {
    await sendPasswordResetEmail(auth, $("remail").value.trim());
    msg("If that email has an admin account, a reset link is on its way.", "ok");
  } catch { msg("Enter a valid email address.", "err"); }
};
</script>
</body>
</html>
